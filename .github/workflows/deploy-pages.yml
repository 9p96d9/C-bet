# GitHub Pages への自動デプロイ（無料・依存ゼロビルド）
# main に push されるたびに content/ からサイトを再ビルドし、gh-pages ブランチへ push して公開する。
# Pages は gh-pages ブランチの初回 push で自動有効化済み（docs/08-deploy.md 参照）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # SITE_ORIGIN=https://<owner>.github.io, BASE_PATH=/<repo> でプロジェクトサイト用にビルド
      - name: Build site (subpath for project pages)
        run: |
          export SITE_ORIGIN="https://${GITHUB_REPOSITORY%%/*}.github.io"
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          node build/build.mjs
      # gh-pages はビルド成果物専用ブランチ。履歴は持たず毎回作り直して force push する
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
