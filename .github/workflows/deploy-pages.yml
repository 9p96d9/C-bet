# GitHub Pages への自動デプロイ（無料・依存ゼロビルド）
# main に push されるたびに content/ からサイトを再ビルドして公開する。
# Pages 未有効でも configure-pages の enablement で自動的に有効化される（docs/08-deploy.md 参照）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pages を自動有効化しつつ、公開URLからサブパス（例: /C-bet）を取得してビルドに渡す
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        run: node build/build.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
